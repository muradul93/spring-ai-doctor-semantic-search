spring.application.name=mongo-semantic-search

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/doctor_db}
spring.data.mongodb.database=${MONGODB_DATABASE:doctor_db}
spring.ai.vectorstore.mongodb.index-name=${MONGODB_VECTOR_INDEX:vector_index}
spring.ai.vectorstore.mongodb.collection-name=${MONGODB_VECTOR_COLLECTION:vector_store}
spring.ai.vectorstore.mongodb.initialize-schema=${MONGODB_INITIALIZE_SCHEMA:false}
spring.ai.vectorstore.mongodb.metadata-fields-to-filter=specialty,city

server.port=${SERVER_PORT:8083}
spring.mvc.problemdetails.enabled=true
